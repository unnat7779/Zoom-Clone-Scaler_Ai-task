# Render Blueprint for the FastAPI backend (free plan).
# The service can also be created manually: New → Web Service → Public Git repository →
# Root directory "backend", the build/start commands below, and the same env vars.
services:
  - type: web
    name: zoom-clone-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://zoom-workplace-clone-tau.vercel.app
      - key: APP_URL
        value: https://zoom-workplace-clone-tau.vercel.app   # used to build invite links
      - key: SEED_ON_START
        value: reset
